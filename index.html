<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myldre</title>
    <style>
      html, body, #root, .map { margin: 0; height: 100%; background: #04060a; }
      .speed-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;
        padding: 4px; border-radius: 999px; background: #0a1220cc; box-shadow: 0 4px 20px #0008; font: 13px/1 ui-monospace, monospace; }
      .speed-bar button { font: inherit; color: #8aa0bf; background: none; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
      .speed-bar button.on { color: #04060a; background: #cfe3ff; }
      .info-card { position: fixed; top: 16px; left: 16px; max-width: min(280px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 12px 40px 12px 14px; border-radius: 12px; background: #0a1220cc; box-shadow: 0 4px 20px #0008; color: #8aa0bf; font: 13px/1.4 ui-monospace, monospace; }
      .info-card h2 { margin: 0 0 4px; font: inherit; font-size: 15px; color: #cfe3ff; }
      .info-card p { margin: 0; }
      .info-card button { position: absolute; top: 6px; right: 8px; font: inherit; font-size: 18px; line-height: 1; color: #8aa0bf; background: none; border: 0; padding: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
